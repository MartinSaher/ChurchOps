<style>

:root[data-theme=violet]{--bg:#f3f0fa;--cd:#fff;--tx:#1f1a2e;--mu:#6f6888;--br:#dcd6ee;--p:#6a45c9;--p2:#8d6be0;--g:#b07a1d}
:root[data-theme=sunset]{--bg:#fdf3e9;--cd:#fff;--tx:#2d1f14;--mu:#7d6a58;--br:#efdcc8;--p:#d2661b;--p2:#ee8a3c;--g:#8a5a12}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior-y:contain;transition:background .35s,color .35s}

.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px dashed var(--br);font-size:15px}
input.tg{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:20px;background:var(--br);position:relative;transition:background .25s;flex:none;margin:0}
input.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 1px 3px #0004}

.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes sl{from{opacity:0;transform:translateX(-30px)}}
@keyframes sr{from{opacity:0;transform:translateX(30px)}}
@keyframes fd{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
@keyframes out{to{opacity:0;transform:translateX(60px) scale(.9)}}
@keyframes pl{40%{transform:scale(1.18)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

input[type=date]{width:100%;font:inherit;font-size:17px;padding:10px;border:1px solid var(--br);border-radius:12px;background:var(--bg);color:var(--tx)}
.dots{gap:3px}.dt{position:relative;font-size:14px;padding:5px 0}
.b{position:absolute;top:-4px;inset-inline-end:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:transparent}.b.ok{background:#2fb36b}.b.w{background:#e5a100}
.wn{border-color:#e5a100;background:color-mix(in srgb,#e5a100 12%,var(--cd));font-size:14px;line-height:1.8}
.bn{border-color:var(--g);font-size:14px}
.rs b[data-r]{cursor:pointer;border-bottom:1px dotted var(--mu)}.rs b.na{border-bottom:0}
.lg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-top:1px dashed var(--br);font-size:13px;align-items:center}.lg b{font-size:13px;text-align:left;color:var(--tx)}.lg.lh{border:0;color:var(--mu);font-size:12px}.lg.lh b{color:var(--mu);font-size:12px}
.lg .up{color:#c0392b}.lg .dn2{color:#2fb36b}
.prog{height:12px;border-radius:8px;background:var(--br);overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:8px;transition:width .5s}
.dn{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;position:relative;animation:pop .5s}.dn i{position:absolute;inset:36px;border-radius:50%;background:var(--cd)}
.lgd{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}.lgd u{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{border:1px solid var(--br);background:var(--cd);color:var(--tx);border-radius:20px;padding:6px 14px;font-size:13.5px;transition:all .2s}.chip.on{background:var(--p);color:var(--on);border-color:var(--p)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.toast.u{animation-duration:6s;pointer-events:auto;display:flex;gap:12px;align-items:center}.toast.u button{background:none;border:0;color:var(--g);font-weight:700;font-size:14px;padding:0 4px;overflow:visible}
.ex{padding:7px 0;border-top:1px dashed var(--br);font-size:14px;line-height:1.7}.big{font-size:26px;font-weight:700;color:var(--p);margin:2px 0 10px}
.cn .ib{padding:8px 9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;text-align:right;background:var(--cd);border:1px solid var(--br);border-radius:18px;padding:14px;color:var(--tx);animation:up .5s both;animation-delay:var(--d);transition:transform .15s,background .35s;font:inherit}
.tile:active{transform:scale(.95)}.tile .ic{font-size:28px;display:block;margin-bottom:6px}.tile b{display:block;font-size:15px}.tile small{color:var(--mu);font-size:11.5px}.tile .v{display:block;font-size:17px;font-weight:700;color:var(--p);margin-top:4px}
.tile .b{top:10px;inset-inline-end:10px;border-color:var(--cd)}
.tile.w{grid-column:span 2;background:linear-gradient(135deg,var(--p2),var(--p));color:var(--on);border:0}.tile.w .v,.tile.w small{color:var(--on)}.tile.w .b{border-color:var(--p)}
.sm{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}.sm small{display:block;color:var(--mu);font-size:11.5px;margin-bottom:3px}.sm b,.sm span{font-size:17px;font-weight:700;color:var(--p)}
.top2{display:flex;gap:8px;align-items:center}.top2 input{flex:1}.idx{width:30px;height:30px;border-radius:50%;background:var(--p);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.rs .fl{font-size:13px;padding:6px 10px}
.pc{animation-duration:.25s}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const AD='٠١٢٣٤٥٦٧٨٩';
const N=v=>{const x=parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[,٬\s]/g,'').replace('٫','.'));return isFinite(x)?x:0};
const fm=x=>{let s=(+x||0).toLocaleString('en',{maximumFractionDigits:2});if(ST.ad)s=s.replace(/\d/g,d=>AD[d]).replace(/,/g,'٬').replace('.','٫');return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const utf8b64=s=>btoa(unescape(encodeURIComponent(s)));
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});

/* ---------- البيانات ---------- */
const mig=c=>{c.x=c.x||[];c.bus=c.bus||[{cap:c.cap,c:c.bc}];['sv','cats','pp','ex'].forEach(k=>c[k]=c[k]||[]);c.lm=c.lm||'pp';c.pp.forEach(p=>{if(p.paid==null&&Array.isArray(p.pay))p.paid=String(p.pay.reduce((a,y)=>a+N(y.a),0)||'')});
 c.yr=c.yr||(new Date(+String(c.id).slice(0,13)||Date.now())).getFullYear();return c};
const blank=()=>mig({id:Date.now()+Math.random().toString(36).slice(2,5),name:'مؤتمر جديد',yr:new Date().getFullYear()});
let DB;try{DB=JSON.parse(localStorage.getItem('cc3'))}catch(e){}
if(!DB||!DB.list)DB={cur:null,list:[]};DB.list.forEach(mig);
const save=()=>{try{localStorage.setItem('cc3',JSON.stringify(DB))}catch(e){}};
const C=()=>DB.list.find(c=>c.id===DB.cur);
let step=-1,view='home',R={};

/* ---------- الإعدادات ---------- */
const DS={th:'auto',snd:1,vol:.7,pk:'soft',hap:1,anim:1,ad:0,bk:14,lb:0};
let S0;try{S0=JSON.parse(localStorage.getItem('cc3s'))}catch(e){}
const ST=Object.assign({},DS,S0||{});
const saveS=()=>{try{localStorage.setItem('cc3s',JSON.stringify(ST))}catch(e){}};
const TH=[['auto','تلقائي','#f4f3ee','#121815'],['green','أخضر','#f4f3ee','#1f6f5c'],['ocean','محيط','#eef4f8','#1c6aa8'],['rose','وردي','#fbf1f3','#c2395e'],['violet','بنفسجي','#f3f0fa','#6a45c9'],['sunset','غروب','#fdf3e9','#d2661b'],['night','ليلي','#121815','#3fae92'],['midnight','منتصف الليل','#0d1420','#5aa7f0'],['amoled','أسود','#000','#3fd6a8']];
function bars(){try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.StatusBar;if(!P)return;
 const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),m=bg.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);let dark=false;
 if(m){let h=m[1];if(h.length==3)h=h.replace(/./g,'$&$&');const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));dark=(v[0]*299+v[1]*587+v[2]*114)/1000<128}
 P.setStyle({style:dark?'DARK':'LIGHT'});P.setBackgroundColor({color:bg||'#f4f3ee'})}catch(e){}}
function syncMeta(){const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--p').trim()||'#1f6f5c');bars()}
function applyS(){const r=document.documentElement;if(ST.th==='auto')delete r.dataset.theme;else r.dataset.theme=ST.th;document.body.classList.toggle('noanim',!ST.anim);syncMeta()}
try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncMeta)}catch(e){}

/* ---------- الأصوات (WebAudio) ---------- */
let AC;const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}};
const PK={soft:{a:'sine',b:'triangle',v:1,s:1,d:1},arcade:{a:'square',b:'square',v:.4,s:0,d:.9},bubble:{a:'sine',b:'sine',v:1.1,s:1.8,d:.8},wood:{a:'triangle',b:'triangle',v:1.3,s:.3,d:.55}};
function tone(f,d,o={}){if(!ST.snd)return;const a=ac();if(!a)return;const p=PK[ST.pk]||PK.soft,t=a.currentTime+(o.t||0),dd=d*p.d,os=a.createOscillator(),g=a.createGain();
 os.type=o.w==2?p.b:p.a;os.frequency.setValueAtTime(f,t);
 if(o.s)os.frequency.exponentialRampToValueAtTime(Math.max(40,f+(o.s-f)*p.s),t+dd);
 const v=Math.max(.0002,.22*ST.vol*(o.v||1)*p.v);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dd);
 os.connect(g);g.connect(a.destination);os.start(t);os.stop(t+dd+.03)}
const SFX={
 tap:()=>tone(620,.07,{s:900}),
 tick:()=>tone(1500,.025,{v:.35,w:2}),
 next:()=>{tone(523,.09,{w:2});tone(784,.13,{w:2,t:.07})},
 prev:()=>{tone(784,.09,{w:2});tone(523,.13,{w:2,t:.07})},
 add:()=>{tone(440,.1,{s:880});tone(880,.12,{t:.08,w:2})},
 del:()=>tone(340,.18,{s:110,v:.8}),
 open:()=>{tone(587,.08,{w:2});tone(880,.1,{t:.06,w:2})},
 dup:()=>{tone(660,.06);tone(660,.06,{t:.08})},
 theme:()=>{[523,659,784].forEach((f,i)=>tone(f,.12,{t:i*.07,w:2}))},
 win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,{t:i*.09,w:2}))},
 warn:()=>tone(240,.12,{s:200,v:.8}),
 on:()=>tone(700,.08,{s:1000}),
 off:()=>tone(700,.08,{s:450})};
const hp=p=>{if(ST.hap&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const fx=(k,h)=>{try{SFX[k]&&SFX[k]()}catch(e){}if(h!==undefined)hp(h)};
let lt=0,lt2=0;
const tickThr=()=>{const n=performance.now();if(n-lt>60){lt=n;fx('tick')}};
const tapThr=()=>{const n=performance.now();if(n-lt2>130){lt2=n;fx('tap')}};

/* ---------- تأثيرات ---------- */
function confetti(){if(!ST.anim)return;const em=['🎉','✨','🎊','⭐','💚','🪅'];
 for(let i=0;i<28;i++){const e=document.createElement('i');e.className='cf';e.textContent=em[i%em.length];
  e.style.cssText=`left:${50+(Math.random()-.5)*30}%;--x:${(Math.random()-.5)*360}px;--y:${-(220+Math.random()*320)}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.15}s`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1950)}

/* ---------- النوافذ + زرار الرجوع ---------- */
let mp=0,ign=0,pushed=0;
function openM(h){const o=$('#md');if(o)o.remove();const d=document.createElement('div');d.id='md';d.innerHTML=h;document.body.appendChild(d);if(!mp){try{history.pushState({m:1},'')}catch(e){}mp=1}return d}
function closeM(){const o=$('#md');if(o)o.remove();if(mp){mp=0;ign++;try{history.back()}catch(e){}}}
const enter=()=>{if(!pushed){try{history.pushState({w:1},'')}catch(e){}pushed=1}};
function leave(){if(pushed){pushed=0;ign++;try{history.back()}catch(e){}}}
function toHome(){leave();home()}
addEventListener('popstate',()=>{if(ign>0){ign--;return}if(mp){mp=0;const o=$('#md');if(o)o.remove();return}
 if(view==='home')return;
 if(view==='hub'){pushed=0;save();home();return}
 try{history.pushState({w:1},'');pushed=1}catch(e){}save();hub()});

/* ---------- الحسابات ---------- */
const has=()=>N(C().m)>0;
function calc(c){const n=N(c.n),m=N(c.m),nt=N(c.nt),R={};

 R.xt=0;R.xo=0;c.x.forEach((x,j)=>{const q=x.q===''||x.q==null?1:N(x.q),g=x.g||'r',cnt=g=='r'?n:g=='o'?m:n+m,t=N(x.a)*q*(x.md=='pp'?cnt:1),h=n+m,a=t*(g=='r'?1:g=='o'?0:(h?n/h:0));R.xt+=a;R.xo+=t-a;R['xi'+j]=t;R['xq'+j]=cnt?t/cnt:0});

 R.h_t=R.hr+R.ho;R.c_t=R.ar+R.ao;R.i_t=R.xt+R.xo;R.g_t=R.gr+R.go;
 let lr=0,lo=0,s1=0,s2=0,paid=0,lreq=0;
 c.pp.forEach((p,j)=>{const ct=(p.cat!==''&&p.cat!=null)?c.cats[+p.cat]:null,def=ct?N(ct.f):(p.g=='o'?N(c.fo):N(c.fr)),fee=(p.req===''||p.req==null)?def:N(p.req),pd=N(p.paid);

 R.lreq=lreq;R.paid=paid;R.prem=lreq-paid;R.pct=lreq?Math.max(0,Math.min(paid/lreq*100,100)):0;R.due=R.ur+R.uo;R.rem=R.due-paid;R.fr=N(c.fr);R.fo=N(c.fo);R.n=n;R.m=m;

function WARN(c,R){const w=[],n=N(c.n),m=N(c.m);
 if(!n)w.push([0,'اكتب عدد الأفراد العاديين.']);
 if(['pr','po','nt','rp','rc','fr','fo','sa','so','cg'].some(k=>N(c[k])<0))w.push([0,'في رقم سالب، راجع الأرقام.']);
 if(n&&!N(c.nt))w.push([1,'عدد الليالي فاضي.']);
 if(n&&N(c.nt)&&!(c.lm=='rm'?N(c.rp):N(c.pr)))w.push([1,'سعر المبيت فاضي.']);
 if(c.lm=='rm'&&!N(c.rc))w.push([1,'اكتب عدد الأفراد في الغرفة.']);
 if(R.T>0&&R.bcap<R.T)w.push([2,`الراكبين (${fm(R.T)}) أكتر من سعة الأتوبيسات (${fm(R.bcap)}).`]);
 if(R.T>0&&!R.bt)w.push([2,'تكلفة الأتوبيس فاضية.']);
 if(n&&!N(c.fr))w.push([3,'اشتراك الفرد الأساسي صفر.']);
 if(c.sb!==''&&c.sb!=null&&N(c.sb)>n)w.push([4,'عدد المستفيدين أكتر من عدد الأفراد.']);
 if(m&&c.sn!==''&&c.sn!=null&&N(c.sn)>m)w.push([4,'مستفيدي خارج الدعم أكتر من عددهم.']);
 if(c.sv.some(s=>!N(s.a)))w.push([5,'في خادم من غير مبلغ تقدمة.']);
 if(R.lr>n)w.push(['p',`العاديين المسجلين (${R.lr}) أكتر من العدد في الخطوة الأولى (${fm(n)}).`]);
 if(R.lo>m)w.push(['p',`المسجلين خارج الدعم (${R.lo}) أكتر من عددهم (${fm(m)}).`]);
 if(R.lreq&&R.paid>R.lreq)w.push(['p','المدفوع أكتر من المطلوب.']);
 return w}

function rr(x,a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath()}

function pdfFromJpeg(jpg,w,h){const enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let off=0;const add=b=>{parts.push(b);off+=b.length};
 const pw=595,ph=Math.round(pw*h/w),cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
 add(enc('%PDF-1.4\n'));offs[1]=off;add(enc('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n'));offs[2]=off;add(enc('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n'));
 offs[3]=off;add(enc(`3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n`));
 offs[4]=off;add(enc(`4 0 obj<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>stream\n`));add(jpg);add(enc('\nendstream endobj\n'));
 offs[5]=off;add(enc(`5 0 obj<</Length ${cs.length}>>stream\n${cs}\nendstream endobj\n`));
 const xo=off;let xr='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
